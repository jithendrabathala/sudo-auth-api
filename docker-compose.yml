version: "3.8"

services:
  db:
    image: mongo:6.0.12-jammy
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db

  server:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - api
      - db
